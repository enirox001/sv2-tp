name: SRI integration test

on:
  workflow_call:

jobs:
  sri-integration-test:
    name: 'SRI integration test'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BITCOIN_CORE_VERSION: '31.0'
      BITCOIN_CORE_PLATFORM: x86_64-linux-gnu
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCENARIO_ROOT: ${{ github.workspace }}/sri-integration-test
      SV2_APPS_REF: main
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || '' }}

      - name: Install apt packages
        run: |
          sudo apt-get update
          sudo apt-get install clang mold ccache build-essential cmake ninja-build pkgconf libboost-dev libevent-dev libsqlite3-dev systemtap-sdt-dev capnproto libcapnp-dev -y

      - name: ccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          toolchain: 1.88.0

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Prepare Bitcoin Core
        run: ./ci/test/04_run_stratum_v2_scenario.sh build-bitcoin-core

      - name: Build sv2-tp
        run: ./ci/test/04_run_stratum_v2_scenario.sh build-sv2-tp

      - name: Build sv2-apps
        run: ./ci/test/04_run_stratum_v2_scenario.sh build-sv2-apps

      - name: Run end-to-end mining test
        env:
          RUNTIME_ROOT: ${{ github.workspace }}/sri-integration-test/mining
        run: ./ci/test/04_run_stratum_v2_scenario.sh run-mining

      - name: Run mining backend disconnect test
        env:
          RUNTIME_ROOT: ${{ github.workspace }}/sri-integration-test/backend-disconnect
        run: ./ci/test/04_run_stratum_v2_scenario.sh run-backend-disconnect

      - name: 'Result: Bitcoin Core'
        if: always()
        run: |
          for scenario in mining backend-disconnect; do
            echo "::group::${scenario} bitcoin debug.log"
            cat "${SCENARIO_ROOT}/${scenario}/datadir/regtest/debug.log" || true
            echo '::endgroup::'
          done

      - name: 'Result: sv2-tp'
        if: always()
        run: |
          for scenario in mining backend-disconnect; do
            echo "::group::${scenario} sv2-tp stdout/stderr"
            cat "${SCENARIO_ROOT}/${scenario}/logs/sv2-tp.log" || true
            echo '::endgroup::'
            echo "::group::${scenario} sv2-tp debug log"
            cat "${SCENARIO_ROOT}/${scenario}/datadir/regtest/sv2-debug.log" || true
            echo '::endgroup::'
          done

      - name: 'Result: pool_sv2'
        if: always()
        run: |
          echo '::group::pool_sv2 log'
          cat "${SCENARIO_ROOT}/mining/logs/pool.log" || true
          echo '::endgroup::'

      - name: 'Result: mining_device'
        if: always()
        run: |
          echo '::group::mining_device log'
          cat "${SCENARIO_ROOT}/mining/logs/mining-device.log" || true
          echo '::endgroup::'
